services:
  - type: web
    name: preciomed
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PRECIOMED_USERNAME
        value: admin
      - key: PRECIOMED_SECRET_KEY
        generateValue: true
      - key: MAX_USERS
        value: 100000
      - key: SESSION_HOURS
        value: 8
      - key: REMEMBER_SESSION_DAYS
        value: 30
      - key: MAX_LOGIN_ATTEMPTS
        value: 5
      - key: LOGIN_LOCK_MINUTES
        value: 15
      - key: RESET_CODE_MINUTES
        value: 15
      - key: RESET_MAX_ATTEMPTS
        value: 5
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: 587
      - key: EMAIL_USER
        value: ""
      - key: EMAIL_PASSWORD
        value: ""
      - key: EMAIL_FROM
        value: ""
