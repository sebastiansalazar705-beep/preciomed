services:
  - type: web
    name: preciomed
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PRECIOMED_USERNAME
        value: admin
      - key: PRECIOMED_ADMIN_EMAIL
        value: admin@preciomed.local
      - key: PRECIOMED_PASSWORD_HASH
        sync: false
      - key: PRECIOMED_SECRET_KEY
        generateValue: true
      - key: SCRAPER_JOB_TOKEN
        generateValue: true
      - key: MAX_USERS
        value: 100000
      - key: ADMIN_EMAILS
        value: admin@preciomed.local,admin2@preciomed.local,admin3@preciomed.local
      - key: SESSION_HOURS
        value: 8
      - key: REMEMBER_SESSION_DAYS
        value: 30
      - key: MAX_LOGIN_ATTEMPTS
        value: 5
      - key: LOGIN_LOCK_MINUTES
        value: 15
      - key: RESET_CODE_MINUTES
        value: 15
      - key: RESET_MAX_ATTEMPTS
        value: 5
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
